<mat-sidenav-container>
  <mat-sidenav
    #drawer
    aria-label="Primary navigation"
    [mode]="compact() ? 'over' : 'side'"
    [opened]="!compact()"
  >
    <app-app-navigation />
  </mat-sidenav>
  <mat-sidenav-content>
    @if (compact()) {
      <mat-toolbar>
        <button type="button" matIconButton aria-label="Open navigation" (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
        <span>QDB Converter</span>
      </mat-toolbar>
    }
    <main class="h-full min-w-0 overflow-x-hidden overflow-y-auto bg-surface">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
