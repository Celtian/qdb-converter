<a class="brand" routerLink="/" aria-label="QDB Converter imported datasets">
  <img ngSrc="qdb-converter-icon.png" width="28" height="28" alt="" priority />
  <span>QDB Converter</span>
</a>

<nav aria-label="Primary navigation">
  @for (group of linkGroups; track group.id) {
    <div class="nav-group" role="group" [attr.aria-labelledby]="'nav-group-' + group.id">
      <span class="nav-group-label" [id]="'nav-group-' + group.id">{{ group.label }}</span>
      @for (link of group.links; track link.path) {
        <a
          matButton
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLink]="link.path"
          [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
        >
          <mat-icon>{{ link.icon }}</mat-icon>
          <span>{{ link.label }}</span>
        </a>
      }
    </div>
  }
</nav>

<div class="utility-actions">
  <mat-divider />
  <a matButton routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page">
    <mat-icon>settings</mat-icon>
    <span>Settings</span>
  </a>
  <button type="button" matButton (click)="openAbout()">
    <mat-icon>info</mat-icon>
    <span>About</span>
  </button>
</div>
