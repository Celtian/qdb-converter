<p [id]="instructionsId()">
  Choose and reorder the columns shown in the {{ tableLabel() }} table. Drag a handle or focus it
  and use the Up and Down arrow keys.
</p>
<div
  class="flex flex-col"
  cdkDropList
  cdkDropListLockAxis="y"
  role="list"
  [cdkDropListData]="orderedColumns()"
  (cdkDropListDropped)="drop($event)"
>
  @for (column of orderedColumns(); track column.key) {
    <div
      class="flex min-h-12 items-center gap-2 rounded-lg bg-surface ps-1"
      cdkDrag
      role="listitem"
      [cdkDragData]="column"
    >
      <mat-checkbox
        [checked]="isColumnVisible(column)"
        [disabled]="column.required"
        (change)="setColumnVisibility(column, $event.checked)"
      >
        {{ column.label }}
      </mat-checkbox>
      <button
        class="shrink-0 cursor-grab text-on-surface-variant"
        cdkDragHandle
        matIconButton
        type="button"
        [attr.aria-label]="'Reorder ' + column.label + ' column'"
        [attr.aria-describedby]="instructionsId()"
        (keydown.arrowup)="moveColumn(column, -1); $event.preventDefault()"
        (keydown.arrowdown)="moveColumn(column, 1); $event.preventDefault()"
      >
        <mat-icon aria-hidden="true">drag_indicator</mat-icon>
      </button>
      <ng-template cdkDragPreview [matchSize]="true">
        <div
          class="flex items-center justify-between overflow-clip! rounded-lg bg-surface px-3! shadow-level3 outline -outline-offset-1 outline-outline-variant"
          aria-hidden="true"
        >
          <span>{{ column.label }}</span>
          <mat-icon>drag_indicator</mat-icon>
        </div>
      </ng-template>
    </div>
  }
</div>
<p class="sr-only" aria-live="polite">{{ announcement() }}</p>
