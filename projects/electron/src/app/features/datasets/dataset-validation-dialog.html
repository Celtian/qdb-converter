<h2 mat-dialog-title>Validate {{ dataset.name }}</h2>

<mat-dialog-content>
  @if (loading()) {
    <div class="loading-state" role="status" aria-live="polite">
      <mat-spinner diameter="44" />
      <p>Checking the managed dataset snapshot…</p>
    </div>
  } @else if (error()) {
    <section class="validation-summary validation-summary--error" role="alert">
      <mat-icon aria-hidden="true">error</mat-icon>
      <div>
        <h3>Validation could not be completed</h3>
        <p>{{ error() }}</p>
      </div>
    </section>
    <button type="button" matButton="outlined" (click)="run()">Try again</button>
  } @else if (result(); as validation) {
    <app-validation-report
      [report]="validation"
      [subject]="dataset.name"
      [headingIdPrefix]="'dataset-validation-' + dataset.id"
    />
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" matButton mat-dialog-close>Close</button>
</mat-dialog-actions>
