name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Verify release tag
        shell: pwsh
        run: |
          git fetch origin master
          if ((git rev-parse HEAD) -ne (git rev-parse origin/master)) {
            throw "Release tags must point to the current master commit."
          }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version."
          }
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem out/make -File -Recurse |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path.Replace((Get-Location).Path + '\', ''))" } |
            Set-Content out/make/SHA256SUMS.txt
      - name: Attach checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" out/make/SHA256SUMS.txt --clobber
