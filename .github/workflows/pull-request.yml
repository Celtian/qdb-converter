name: Pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: bun install --frozen-lockfile
      - run: bun run package:desktop
      - name: Verify executable and ASAR layout
        shell: pwsh
        run: |
          $exe = Get-ChildItem out -Filter "QDB Converter.exe" -Recurse
          $asar = Get-ChildItem out -Filter app.asar -Recurse
          if (!$exe -or !$asar) { throw "Packaged executable or app.asar is missing." }
